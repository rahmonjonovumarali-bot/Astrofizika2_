<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quyosh sistemasi jismlarining tabiati — 3D ilmiy sayohat (L1–L7)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02040b; --panel:rgba(7,13,30,.74); --line:rgba(120,170,255,.17);
  --text:#e8eefc; --muted:#90a0c2; --gold:#f5c45e; --green:#4ef2b0; --blue:#5fb4ff;
  --red:#ff5d5d; --violet:#a98bff;
  --serif:'STIX Two Text','Times New Roman',Times,serif;
  --sans:Inter,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%);z-index:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .8s ease}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.ui{transition:opacity .8s ease,transform .8s ease}
body.intro .ui,body.cinema .ui{opacity:0;pointer-events:none}
body.intro #tags,body.cinema #tags{display:none}

/* top bar */
#topbar{position:fixed;top:12px;left:14px;right:14px;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.brand{display:flex;gap:11px;align-items:center;min-width:250px}
.brand .logo{font-size:26px;color:var(--gold);text-shadow:0 0 16px rgba(245,196,94,.8);display:inline-block;animation:spin 14s linear infinite}
.brand b{font-family:var(--serif);letter-spacing:.08em;font-size:14.5px;display:block;font-weight:600}
.brand small{color:var(--muted);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.scene-title{font-family:var(--serif);font-size:23px;display:flex;gap:12px;align-items:center;white-space:nowrap}
#sceneNum{color:var(--gold);font-size:12px;font-family:var(--sans);font-weight:800;letter-spacing:.12em;border:1px solid rgba(245,196,94,.45);padding:3px 9px;border-radius:999px}
.tools{display:flex;gap:6px;min-width:250px;justify-content:flex-end}
.tools button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:16px;transition:.2s}
.tools button:hover,.tools button.on{background:rgba(95,180,255,.16);border-color:rgba(95,180,255,.55)}

/* nav */
#nav{position:fixed;left:14px;top:78px;width:214px;padding:10px 8px;z-index:15;max-height:calc(100vh - 92px);overflow:auto}
.nav-head{font-size:10px;letter-spacing:.2em;color:var(--muted);padding:2px 10px 8px;text-transform:uppercase}
.nav-item{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;position:relative;transition:.25s;user-select:none}
.nav-item .n{font-weight:800;font-size:11px;color:#6b7ba0;width:24px;font-variant-numeric:tabular-nums}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.045)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(245,196,94,.18),rgba(245,196,94,0))}
.nav-item.active .n{color:var(--gold)}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.nav-item.visited .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-left:auto}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-item.special{color:#cfe3ff}
.nav-item.special .n{color:var(--green)}

/* side panel */
#side{position:fixed;right:14px;top:78px;bottom:72px;width:392px;z-index:15;display:flex;flex-direction:column;overflow:hidden}
#sideInner{overflow:auto;padding:16px 16px 20px;flex:1;scroll-behavior:smooth}
#sideInner::-webkit-scrollbar,#lecBody::-webkit-scrollbar,.modal-card::-webkit-scrollbar,#nav::-webkit-scrollbar{width:6px}
#sideInner::-webkit-scrollbar-thumb,#lecBody::-webkit-scrollbar-thumb,.modal-card::-webkit-scrollbar-thumb,#nav::-webkit-scrollbar-thumb{background:rgba(120,170,255,.25);border-radius:6px}
#side h2{font-family:var(--serif);font-size:25px;line-height:1.15;margin-bottom:4px;font-weight:600}
.kicker{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px}
#side p{font-size:13.5px;line-height:1.62;color:#c9d4ec;margin:8px 0}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:12px;margin:11px 0}
.card h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;font-weight:700}
.card ul{padding-left:18px;font-size:13px;line-height:1.6;color:#cfd9ef}
.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;transition:.2s;line-height:1.2}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(180deg,rgba(245,196,94,.3),rgba(245,196,94,.1));border-color:rgba(245,196,94,.6);color:#ffe8b4}
.btn.green{background:linear-gradient(180deg,rgba(78,242,176,.25),rgba(78,242,176,.08));border-color:rgba(78,242,176,.55);color:#c9ffe9}
.btn.blue{background:linear-gradient(180deg,rgba(95,180,255,.25),rgba(95,180,255,.08));border-color:rgba(95,180,255,.55);color:#d4ebff}
.btn.red{background:linear-gradient(180deg,rgba(255,93,93,.25),rgba(255,93,93,.08));border-color:rgba(255,93,93,.55);color:#ffd9d9}
.btn.on{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(245,196,94,.4)}
.btn.big{padding:13px 16px;font-size:15px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
table.sci{width:100%;border-collapse:collapse;font-size:12.5px}
table.sci th{text-align:left;color:var(--gold);font-weight:700;padding:6px 5px;border-bottom:1px solid rgba(245,196,94,.35);font-size:11px;letter-spacing:.04em}
table.sci td{padding:6px 5px;border-bottom:1px solid var(--line);color:#d5def3;vertical-align:top;line-height:1.4}
table.sci tr.hl td{background:rgba(245,196,94,.08)}
table.sci tr.clickable{cursor:pointer}
table.sci tr.clickable:hover td{background:rgba(95,180,255,.08)}
.f{font-family:var(--serif);font-size:16.5px;color:#ffe7b0}
.fbox{font-family:var(--serif);font-size:17px;color:#fff1cf;background:rgba(245,196,94,.07);border:1px solid rgba(245,196,94,.3);border-radius:10px;padding:10px 12px;text-align:center;line-height:1.7}
.term{display:inline-block;padding:1px 6px;margin:1px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:.2s}
.term:hover,.term.on{border-color:currentColor;background:rgba(255,255,255,.06)}
label.lbl{font-size:11.5px;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;margin:8px 0 4px}
label.lbl b{color:#fff;font-family:var(--serif);font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,rgba(95,180,255,.5),rgba(245,196,94,.5));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(245,196,94,.35),0 0 14px rgba(245,196,94,.8);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 0 4px rgba(245,196,94,.35),0 0 14px rgba(245,196,94,.8)}
select{background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font-family:inherit;font-size:13px;width:100%}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ro{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.ro span{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.ro b{font-size:17px;font-family:var(--serif);font-weight:600}
.meter{height:10px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));width:0;transition:width .45s}
.stable-badge{margin-top:10px;text-align:center;padding:10px;border-radius:12px;font-weight:800;letter-spacing:.14em;font-size:14px;border:1px solid rgba(78,242,176,.6);color:#c9ffe9;background:rgba(78,242,176,.12);box-shadow:0 0 26px rgba(78,242,176,.35);animation:pulse 1.6s ease-in-out infinite}
.stable-badge.off{opacity:.25;animation:none;box-shadow:none;border-color:var(--line);color:var(--muted);background:transparent}
.scheme{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0}
.scheme .sb{padding:9px 18px;border-radius:12px;border:1px solid rgba(95,180,255,.5);background:rgba(95,180,255,.1);font-weight:800;letter-spacing:.16em;font-size:14px;opacity:0;animation:fadeUp .8s forwards}
.scheme .sb.g{border-color:rgba(245,196,94,.6);background:rgba(245,196,94,.12);color:#ffe7b0}
.scheme .sb.r{border-color:rgba(255,120,110,.6);background:linear-gradient(90deg,rgba(255,90,78,.16),rgba(92,157,255,.16))}
.scheme .ar{color:var(--gold);opacity:0;animation:fadeUp .6s forwards;font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:rgba(255,255,255,.04);cursor:pointer;transition:.2s;font-family:var(--serif)}
.chip:hover,.chip.on{border-color:var(--gold);color:#ffe7b0;background:rgba(245,196,94,.1)}
canvas.plot{width:100%;display:block;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid var(--line)}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:6px}
.qbtn{margin-top:8px}
.stages{display:flex;gap:4px;margin:8px 0}
.stages div{flex:1;text-align:center;font-size:10.5px;padding:7px 2px;border-radius:8px;border:1px solid var(--line);color:var(--muted);transition:.3s;font-weight:700;letter-spacing:.03em}
.stages div.on{color:#111;background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px rgba(245,196,94,.55)}

/* lecture */
#lecture{position:fixed;left:242px;right:420px;bottom:14px;z-index:16;max-height:46vh;display:flex;flex-direction:column}
.lec-head{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px}
.lec-badge{font-weight:800;font-size:12px;letter-spacing:.16em;color:var(--gold);white-space:nowrap}
#lecTitle{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lec-actions{display:flex;gap:6px;flex-shrink:0}
#lecBody{overflow:auto;padding:2px 20px 16px;font-size:15.5px;line-height:1.72;color:#e0e8fb;display:none}
#lecture.open #lecBody{display:block}
#lecBody p{margin:0 0 11px}
#lecBody b{color:#ffe7b0}
#lecBody .t{color:var(--green);font-weight:600}
#lecBody .q{display:block;color:var(--gold);font-weight:700;font-family:var(--serif);font-size:17px;margin-top:4px}

#btnTeacher{position:fixed;right:14px;bottom:14px;z-index:17;width:392px;height:46px;border-radius:14px;border:1px solid rgba(245,196,94,.55);background:linear-gradient(180deg,rgba(245,196,94,.26),rgba(245,196,94,.08));color:#ffe8b4;font-weight:800;letter-spacing:.12em;font-size:13px;backdrop-filter:blur(10px)}
#btnTeacher:hover{box-shadow:0 0 24px rgba(245,196,94,.35)}

/* formula tags */
#tags{position:fixed;inset:0;pointer-events:none;z-index:12}
.ftag{position:absolute;left:0;top:0;pointer-events:auto;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(8,16,38,.78);border:1px solid rgba(245,196,94,.5);color:#ffe7b0;white-space:nowrap;display:none;font-weight:600;backdrop-filter:blur(6px);transition:background .2s}
.ftag:hover{background:rgba(245,196,94,.22)}

/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(1,3,10,.62);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
#modal.hidden{display:none}
.modal-card{width:min(900px,93vw);max-height:88vh;overflow:auto;padding:28px 32px;position:relative;animation:pop .35s ease}
.mclose{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px}
.modal-card h3{font-family:var(--serif);font-size:28px;margin-bottom:6px;font-weight:600}
.modal-card h5{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px;font-weight:800}
.modal-card p{font-size:15.5px;line-height:1.72;color:#dbe4f7;margin-bottom:10px}
.modal-card .board{font-family:var(--serif);font-size:18px;line-height:1.8;background:#0d1a14;border:6px solid #3a2b1a;border-radius:8px;padding:14px 18px;color:#eaf6ea;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.modal-card .mainidea{font-family:var(--serif);font-size:20px;line-height:1.5;color:#fff1cf;border-left:3px solid var(--gold);padding:6px 14px;background:rgba(245,196,94,.06);border-radius:0 10px 10px 0}
.modal-card .ask{font-size:17px;color:#cfe8ff;border:1px dashed rgba(95,180,255,.5);padding:12px 14px;border-radius:10px}
.think-q{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;background:rgba(255,255,255,.03)}
.think-q .qq{font-family:var(--serif);font-size:21px;color:#fff;line-height:1.4}
.think-q .ans{display:none;margin-top:12px;font-size:15px;line-height:1.7;color:#cfe;border-top:1px solid var(--line);padding-top:10px}
.think-q.open .ans{display:block;animation:fadeUp .6s}

/* center overlay */
#center{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 260px}
#center.hidden{display:none}
#center.top{justify-content:flex-start;padding-top:96px}
#center .inner{pointer-events:auto;max-width:900px}
.big-title{font-family:var(--serif);font-size:clamp(34px,4.6vw,70px);letter-spacing:.06em;line-height:1.1;background:linear-gradient(180deg,#ffffff,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(245,196,94,.45));font-weight:600}
.mid-title{font-family:var(--serif);font-size:clamp(22px,2.6vw,38px);line-height:1.3;color:#fff;text-shadow:0 0 24px rgba(95,180,255,.6)}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.7vw,24px);color:#cfe0ff;margin-top:16px}
.fade-in{opacity:0;animation:fadeUp 1.3s forwards}
.banner{font-family:var(--serif);font-size:clamp(40px,5vw,76px);font-weight:700;letter-spacing:.05em;animation:pop .5s ease}
.banner.ok{color:#7dffc8;text-shadow:0 0 30px rgba(78,242,176,.8)}
.banner.bad{color:#ff8a8a;text-shadow:0 0 30px rgba(255,80,80,.8);font-size:clamp(22px,2.6vw,36px)}

/* detective bar */
#detBar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:18;display:flex;gap:12px;padding:12px;align-items:stretch}
#detBar.hidden{display:none}
.model-btn{width:158px;padding:12px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(10,18,40,.8);font-weight:800;text-align:center;font-size:13px;letter-spacing:.05em;transition:.25s}
.model-btn .ic{font-size:30px;display:block;margin-bottom:4px}
.model-btn:hover{transform:translateY(-3px);border-color:rgba(95,180,255,.6)}
.model-btn.sel{border-color:var(--gold);box-shadow:0 0 26px rgba(245,196,94,.5);background:rgba(245,196,94,.14)}
.model-btn.wide{width:210px;font-size:12px}
.ev{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer;background:rgba(255,255,255,.03);transition:.25s}
.ev:hover{border-color:rgba(95,180,255,.55)}
.ev.seen{border-color:rgba(78,242,176,.55);background:rgba(78,242,176,.06)}
.ev .et{font-weight:700;font-size:13.5px}
.ev .ex{display:none;font-size:13px;line-height:1.6;color:#cfd9ef;margin-top:6px}
.ev.seen .ex{display:block}
.score-pill{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;border:1px solid rgba(245,196,94,.55);color:#ffe7b0;font-weight:800;font-size:13px;background:rgba(245,196,94,.1)}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal{padding:12px 8px;border-radius:12px;border:1px dashed rgba(255,255,255,.25);text-align:center;font-weight:800;font-size:12.5px;letter-spacing:.06em;cursor:grab;background:rgba(255,255,255,.04);user-select:none;transition:.2s}
.pal:hover{border-style:solid;border-color:var(--gold);transform:translateY(-2px)}
.pal .ic{font-size:22px;display:block}
.pal .cnt{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
#dropHint{position:fixed;left:50%;top:50%;width:320px;height:320px;margin:-180px 0 0 -160px;border-radius:50%;border:2px dashed rgba(245,196,94,.35);z-index:5;pointer-events:none;display:none;align-items:flex-end;justify-content:center;color:rgba(255,231,176,.7);font-size:12px;letter-spacing:.12em;padding-bottom:18px;text-transform:uppercase}
#dropHint.show{display:flex}
#dropHint.over{border-color:var(--gold);box-shadow:0 0 50px rgba(245,196,94,.35) inset}
.rank{font-family:var(--serif);font-size:clamp(28px,3.4vw,48px);color:#fff1cf;margin:10px 0}
.bignum{font-family:var(--serif);font-size:clamp(70px,9vw,140px);font-weight:700;color:#fff;text-shadow:0 0 40px rgba(245,196,94,.8);line-height:1}

#toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-14px);opacity:0;z-index:70;padding:10px 18px;border-radius:12px;background:rgba(8,16,38,.9);border:1px solid rgba(245,196,94,.5);color:#ffe7b0;font-weight:600;font-size:14px;transition:.4s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* intro */
#introUI{position:fixed;inset:0;z-index:25;pointer-events:none;display:none}
body.intro #introUI{display:block}
#skipIntro{position:absolute;right:22px;bottom:22px;pointer-events:auto;padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);font-size:13px;font-weight:600;letter-spacing:.06em}
.intro-hint{position:absolute;left:22px;bottom:26px;color:rgba(200,215,240,.6);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
#loader{position:fixed;inset:0;z-index:100;background:#02040b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1s}
#loader .ring{width:66px;height:66px;border-radius:50%;border:2px solid rgba(245,196,94,.2);border-top-color:var(--gold);animation:spin 1s linear infinite;box-shadow:0 0 30px rgba(245,196,94,.25)}
#loader .lt{font-family:var(--serif);letter-spacing:.14em;color:#cfd9ef;font-size:15px}
#loader .err{color:#ff9a9a;max-width:520px;text-align:center;font-size:14px;line-height:1.6}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

l7:{title:'L7: Merkuriy aylanishini radar bilan aniqlash',
 lecture:[
 `Hurmatli talabalar, Merkuriy kichik (5–13″) va Quyoshga yaqin, sirtida aniq belgilar yo‘q — shuning uchun uning aylanish davrini optik kuzatishdan aniqlash qiyin edi. XX asr o‘rtalarigacha uni Quyoshga doim bir tomoni bilan qaragan, ya’ni davri orbital davrga (88 sutka) teng deb hisoblashgan. 1965-yilda Pettengill va Dayts Aresibo radioteleskopi bilan <span class="t">radiolokatsiya</span> qilib, davr ≈ 59 sutka ekanini aniqladi. Hozirgi qiymat 58,646 sutka.`,
 `Usul: ν₀ = 430 MHz li qisqa radioimpuls yuboriladi. U Δ masofadagi sayyoraga borib qaytadi: Δt = 2Δ/c (Δ = 0,55–1,45 a.b. bo‘lsa, 9–24 minut). Eng avval disk markazidan (subradar nuqta), keyin τ kechikish bilan halqalardan qaytadi. Halqa radiusi h = cτ/2 va r = √(2Rh − h²) bilan topiladi: kechikish qancha katta bo‘lsa, halqa shuncha markazdan uzoq. 3D da τ slayderini siljiting — yashil halqa kengayadi.`,
 `Aylanish tufayli halqaning bir cheti radarga yaqinlashadi (ν−), ikkinchisi uzoqlashadi (ν+). Dopler siljishi <b>ikki baravar</b> bo‘ladi (sayyora avval qabul qiluvchi, so‘ng manba): Δν = 2ν₀v/c, ikki chet orasida δν = 4ν₀v/c, v = Ω·r. Demak Ω = c·δν/(4ν₀r) va P = 2π/Ω. Misol: τ = 490 μs → h = 73,45 km, r ≈ 594 km, δν = 4,26 Hz → P ≈ 58,2 sutka.`,
 `Bir necha τ uchun P ni topib o‘rtachasini olamiz (≈ 58,7 ± 0,2 sutka). Nisbat P/P_orb = 0,667 ≈ 2/3 — <b>3:2 spin-orbital rezonans</b>: Merkuriy 2 orbitada 3 marta aylanadi. Natijada Quyosh sutkasi 1/(1/58,646 − 1/87,969) ≈ 176 Yer sutkasi — ikki orbital yil! Veneraning teskari aylanishi (243 sutka) ham shu usul bilan topilgan: bulutlar optik kuzatishga to‘sqinlik qiladi.`],
 main:'Radar kechikishi sirt geometriyasini (h, r), Dopler cho‘qqilari orasidagi farq esa aylanish tezligini beradi: P = 2π/Ω, Ω = cδν/(4ν₀r). Natija — 3:2 rezonans.',
 board:['Δt = 2Δ/c;   Δν = 2ν₀v/c;   δν = 4ν₀v/c','h = cτ/2;   r = √(2Rh − h²)','Ω = c·δν/(4ν₀r);   v_ekv = ΩR;   P = 2π/Ω','P/P_orb = 58,646/87,969 = 2/3;   1/P_sut = 1/P_sid − 1/P_orb → 176 sut'],
 ask:'Nega kechikish oshgan sari cho‘qqilar orasidagi chastota farqi ortadi?',
 ans:'τ oshsa halqa radiusi r (aylanish o‘qidan masofa) ortadi, v = Ωr ortadi, shuning uchun δν = 4ν₀Ωr/c ham ortadi.'},
l6:{title:'L6: Tutash spektrda energiya taqsimoti. Spektral chiziqlarning intensivligi va kengligi',
 lecture:[
 `Hurmatli talabalar, bugungi laboratoriya ishi yulduz nuri haqida: <b>yulduz spektrida nimani o‘qish mumkin?</b> Birinchi qatlam — <span class="t">tutash spektr</span>. Qizigan jism har bir to‘lqin uzunligida nur chiqaradi va uning shakli faqat temperaturaga bog‘liq. Bu shaklni <b>Plank formulasi</b> beradi: F_λ = c₁/λ⁵ · 1/[exp(c₂/λT) − 1]. Temperatura ko‘tarilganda hamma to‘lqin uzunligida nur ortadi (to‘la oqim σT⁴ — 4-darajali!), maksimum esa qisqa to‘lqinlar tomon siljiydi: λ_max·T = 2,898·10⁻³ m·K (Vin qonuni).`,
 `Panelda T₁ va T₂ ni siljiting. T₂ = 2T₁ bo‘lsa, to‘la oqim 16 marta ortadi va maksimum ikki marta qisqaradi. Quyosh (5772 K) maksimumi 502 nm — ko‘rinadigan sohada; 3000 K li sovuq yulduzniki infraqizilda (966 nm), shuning uchun u qizil; 25 000 K li yulduzniki ultrabinafshada (116 nm), ko‘rinadigan sohada esa faqat “dumi” — shuning uchun u ko‘kish-oq. Energiya (F_λ) va fotonlar soni (N_λ) maksimumlari ham turlicha: N_λ = F_λ·λ/(hc), shuning uchun λ_N,max·T = 3,67·10⁻³ m·K.`,
 `Ikkinchi qatlam — <span class="t">spektral chiziqlar</span>. Vodorod atomida n-sath energiyasi E_n = −13,598·Z²/n² eV, o‘tish chizig‘i esa 1/λ = R·Z²(1/n₁² − 1/n₂²) (Ridberg–Balmer). n₁ = 1 — Layman (ultrabinafsha), n₁ = 2 — Balmer (ko‘rinadigan: Hα 6563 Å), n₁ = 3 — Pashen (infraqizil). Vodorodsimon ionlar (He II, Fe XXVI) chiziqlari taxminan Z² marta qisqa to‘lqinli — rentgen sohada. Faqat asosiy sathga o‘tish — rezonans chiziq.`,
 `Chiziq <b>intensivligi</b> yuqori sathdagi atomlar soniga bog‘liq: Bolsman formulasi N_n/N₁ = n²·exp(−U_n/kT) va Saxa ionlanish formulasi. Ikkalasini birga olsak, Balmer chiziqlari eng kuchli bo‘ladigan temperatura ≈ 10 000 K — ya’ni A0 sinf yulduzlari: sovuqroq bo‘lsa n = 2 sathda atom kam, issiqroq bo‘lsa vodorod ionlashib ketadi. <b>Kenglik</b>: tabiiy (Geyzenberg, ≈ 10⁻³ Å) juda tor, Dopler (issiqlik harakati, ≈ 0,4 Å) — taxminan 300 marta katta. Panelning “Kenglik” tabida ularni 3D profilda solishtiring.`],
 main:'Tutash spektr shakli temperaturani (Plank, Vin, σT⁴), chiziqlar o‘rni — kimyoviy tarkibni (Ridberg), chiziq kuchi — qo‘zg‘alish va ionlanishni (Bolsman, Saxa), kengligi — harakat va bosimni aytib beradi.',
 board:['F_λ = c₁/λ⁵ · 1/[e^{c₂/λT} − 1],  N_λ = F_λ·λ/(hc)','λ_max·T = 2,8978·10⁻³ m·K;  λ_N,max·T = 3,6698·10⁻³ m·K;  F = σT⁴','1/λ = R_M·Z²·(1/n₁² − 1/n₂²);  E_n = −13,598·Z²/n²  eV','N_n/N₁ = n²·exp(−U_n/kT);  N_II·N_e/N_I = 2,41·10¹⁵ T^{3/2} e^{−157800/T}','Δλ_N = λ²/(2πc)·(1/τ_k + 1/τ_i);  FWHM_D = 1,665·(λ/c)·√(2kT/m)'],
 ask:'Nega Balmer chiziqlari Quyoshda (5772 K) ham, 25 000 K li yulduzda ham kuchsiz, A0 yulduzlarida esa eng kuchli?',
 ans:'Quyoshda n = 2 sathdagi atomlar juda kam (Bolsman: N₂/N₁ ~ 10⁻⁸); 25 000 K da vodorod deyarli to‘liq ionlashgan (Saxa). ~10 000 K da ikkala omil muvozanatlashadi.'},
tizim:{
 title:'Quyosh sistemasi: tarkibi va masshtabi',
 lecture:[
 `Hurmatli talabalar, bugun biz o‘z “kosmik uyimiz” — <b>Quyosh sistemasi</b> bo‘ylab sayohat qilamiz. Uning markazida Quyosh joylashgan: u sistema massasining <b>99,86 foizini</b> o‘zida jamlagan. Qolgan barcha jismlar — sayyoralar, ularning yo‘ldoshlari, mitti sayyoralar, asteroidlar, kometalar va meteor jismlar — Quyosh tortishishi ta’sirida uning atrofida aylanadi.`,
 `Sakkiz sayyora ikki guruhga bo‘linadi. Ichki to‘rttasi — Merkuriy, Venera, Yer va Mars — <span class="t">yer tipidagi sayyoralar</span>: ular kichik, zich (o‘rtacha zichligi 3,9–5,5 g/sm³), qattiq toshli sirtga ega. Tashqi to‘rttasi — Yupiter, Saturn, Uran va Neptun — <span class="t">gigant sayyoralar</span>: ular ulkan, zichligi kichik (Saturnniki hatto suvdan ham kam — 0,69 g/sm³), asosan vodorod, geliy va muzlardan tashkil topgan.`,
 `Masofalarni his qilaylik. Yerdan Quyoshgacha bo‘lgan o‘rtacha masofa — <b>1 astronomik birlik</b> (1 a.b. ≈ 150 mln km). Yorug‘lik bu masofani 8 daqiqa 20 soniyada bosib o‘tadi. Neptun 30 a.b. uzoqlikda, Koyper kamari 30–50 a.b., kometalar manbai bo‘lgan Oort buluti esa o‘n minglab a.b. gacha cho‘ziladi. Ekrandagi modelda o‘lchamlar va masofalar ko‘rgazmali bo‘lishi uchun o‘zgartirilgan.`,
 `Mars va Yupiter orasida <b>asteroidlar kamari</b>, Neptundan narida <b>Koyper kamari</b> joylashgan. Sayyoralar deyarli bir tekislikda va bir yo‘nalishda aylanadi — bu Quyosh sistemasining kelib chiqishi haqidagi muhim “iz”, unga darsimiz oxirida qaytamiz.`,
 `Bugungi asosiy savollarimiz: sayyoralarni qanday tekshiramiz? Ularning atmosferasi qanday sharoitda, qanday harakatda va nima uchun ba’zilari atmosferasini yo‘qotgan? Ichki tuzilishi qanday? Gigantlar qanday tuzilgan? Kichik jismlar nimadan dalolat beradi? Va nihoyat — bu xilma-xil olamlar qanday paydo bo‘lgan?`
 ],
 main:'Quyosh sistemasi — Quyosh va uning tortishishi bilan bog‘langan jismlar: 4 ta yer tipidagi sayyora, 4 ta gigant sayyora va son-sanoqsiz kichik jismlar.',
 board:['1 a.b. ≈ 1,496·10⁸ km','Yer tipi: Merkuriy, Venera, Yer, Mars — ρ̄ = 3,9–5,5 g/sm³','Gigantlar: Yupiter, Saturn, Uran, Neptun — ρ̄ = 0,7–1,6 g/sm³'],
 ask:'Nima uchun zich, toshli sayyoralar Quyoshga yaqin, gigantlar esa uzoqda joylashgan?'
},
usullar:{
 title:'Quyosh sistemasi jismlarini tekshirishning xususiyatlari',
 lecture:[
 `Astronomiya laboratoriya fanlaridan bir muhim jihati bilan farq qiladi: biz o‘rganayotgan obyektni qo‘lga olib, tajriba o‘tkaza olmaymiz. Shuning uchun sayyoralar haqidagi ma’lumotning asosiy manbai — <b>ulardan kelayotgan nurlanish</b>. Sayyoralar o‘zi yorug‘lik chiqarmaydi: biz ularning <b>Quyosh nurini qaytarishini</b> va o‘zining <b>infraqizil (issiqlik) nurlanishini</b> o‘lchaymiz.`,
 `Birinchi usul — <span class="t">fotometriya</span>: sayyora yorqinligini o‘lchab, uning <span class="t">albedosini</span> — tushgan nurning qancha qismini qaytarishini topamiz. Venera bulutlari nurning 76 % ini qaytaradi, Oy esa atigi ~11 % ini. Ikkinchi usul — <span class="t">spektral tahlil</span>: qaytgan nurning spektridagi qora yutilish chiziqlari atmosfera tarkibini ko‘rsatadi. Masalan, Mars va Venera spektrida CO₂ chiziqlari, Yupiter va Neptunda metan chiziqlari kuzatiladi. Infraqizil spektr esa haroratni beradi.`,
 `Uchinchi usul — <span class="t">radiolokatsiya</span>: Yerdan radio impuls yuborib, uning qaytish vaqti va chastota siljishidan masofa va aylanish tezligini aniqlaymiz. Aynan radar yordamida 1960-yillarda Veneraning 243 sutkada <b>teskari</b> aylanishi va Merkuriyning haqiqiy aylanish davri (58,6 sutka) aniqlangan. Radar Veneraning qalin bulutlari ostidagi sirtini ham “ko‘radi”.`,
 `To‘rtinchi usul — yulduzning sayyora orqasiga yashirinishi, ya’ni <span class="t">okkultatsiya</span>. Yulduz nuri atmosfera orqali o‘tib, asta-sekin so‘nadi; so‘nish egri chizig‘idan atmosferaning zichligi va harorati profilini topamiz. 1977-yilda shu usulda Uranning halqalari kashf etilgan. Sayyora massasi esa uning <b>yo‘ldoshlari harakatidan</b> — Keplerning uchinchi qonuni orqali aniqlanadi: M = 4π²a³/(GT²).`,
 `Va nihoyat, eng kuchli usul — <span class="t">kosmik apparatlar</span>. Ular sayyora yonidan uchib o‘tadi (Voyager), uning orbitasida ishlaydi (Juno, Cassini), sirtiga qo‘nadi (1970-yil “Venera-7” — boshqa sayyoraga birinchi muvaffaqiyatli qo‘nish) yoki namuna olib qaytadi (Apollon, Hayabusa, OSIRIS-REx). Apparat trayektoriyasining og‘ishidan sayyoraning gravitatsion maydoni va ichki tuzilishi haqida ham xulosa chiqariladi.`
 ],
 main:'Sayyoralarni masofadan — qaytgan va o‘zi chiqargan nurlanish orqali, hamda kosmik apparatlar yordamida bevosita tekshiramiz.',
 board:['A = Φ_qaytgan / Φ_tushgan  (albedo)','M = 4π²a³ / (GT²)  (yo‘ldosh orqali massa)','Usullar: fotometriya · spektroskopiya · radar · okkultatsiya · kosmik apparatlar'],
 ask:'Veneraning sirtini optik teleskop bilan ko‘rib bo‘lmaydi. Uning aylanish davrini qanday usul bilan aniqlash mumkin va nima uchun?'
},
atmofizika:{
 title:'Atmosferada fizik sharoit',
 lecture:[
 `Endi sayyoralar <b>atmosferasiga</b> kiramiz. Atmosfera — sayyorani o‘rab turgan va uning tortishishi bilan ushlab turilgan gaz qobig‘i. Uning holatini uchta asosiy kattalik belgilaydi: <b>bosim</b>, <b>harorat</b> va <b>kimyoviy tarkib</b>. Yer sirtida bosim 1 bar, Venerada 92 bar — bu okean tubida 900 metr chuqurlikdagi bosimga teng! Marsda esa atigi 0,006 bar.`,
 `Balandlik oshgan sari bosim qanday kamayadi? Har bir gaz qatlami o‘zidan yuqoridagi qatlamlar og‘irligini ko‘tarib turadi — bu <span class="t">gidrostatik muvozanat</span>. Natijada bosim balandlik bo‘yicha <b>eksponensial</b> kamayadi: p = p₀·e^(−h/H). Bu yerda <span class="t">balandlik shkalasi</span> H = RT/(μg) — bosim e ≈ 2,72 marta kamayadigan balandlik. Yer uchun H ≈ 8,5 km, Venera uchun ≈ 16 km, Mars uchun ≈ 11 km.`,
 `Formuladan ko‘rinadiki, atmosfera qanchalik <b>issiq</b> (T katta), gazi <b>yengil</b> (μ kichik) va tortishish <b>kuchsiz</b> (g kichik) bo‘lsa, u shunchalik “qalin”, ya’ni yuqoriga cho‘zilgan bo‘ladi. Shuning uchun Saturnning yo‘ldoshi Titan atmosferasi juda baland ko‘tariladi.`,
 `Harorat ham balandlik bilan murakkab o‘zgaradi. Yerda pastki qatlam — <b>troposfera</b>da (0–12 km) havo yuqoriga ko‘tarilgan sari soviydi; <b>stratosfera</b>da ozon ultrabinafsha nurni yutib, havoni isitadi; <b>mezosfera</b>da yana soviydi; <b>termosfera</b>da Quyoshning qattiq nurlanishi gazni 1000 K gacha qizdiradi. Eng yuqorida — <span class="t">ekzosfera</span>: u yerda molekulalar deyarli to‘qnashmaydi.`,
 `Sayyoraning <b>muvozanat harorati</b> Quyoshdan olgan va o‘zi nurlantirgan energiya tengligidan topiladi: T ≈ 278 K·(1−A)^¼/√r. Yer uchun bu −18 °C chiqadi, lekin haqiqiy o‘rtacha harorat +15 °C. Farqni <span class="t">issiqxona effekti</span> beradi — bunga Venera misolida batafsil to‘xtalamiz.`
 ],
 main:'Atmosferada bosim balandlik bo‘yicha eksponensial kamayadi; uning “qalinligini” balandlik shkalasi H = RT/(μg) belgilaydi.',
 board:['p(h) = p₀·e^(−h/H)','H = RT / (μg):  Yer ≈ 8,5 km · Venera ≈ 16 km · Mars ≈ 11 km','T_muv ≈ 278 K·(1−A)^¼ / √r[a.b.]'],
 ask:'Agar Yer atmosferasi geliydan iborat bo‘lganda (μ = 4), balandlik shkalasi qanday o‘zgarardi?'
},
sirkulyatsiya:{
 title:'Atmosfera sirkulyatsiyasi',
 lecture:[
 `Atmosfera hech qachon tinch turmaydi. Uning harakatlanishining asosiy sababi — <b>notekis isish</b>: ekvator Quyosh nurlarini tik oladi va kuchli isiydi, qutblar esa kam isiydi. Issiq havo ekvatorda ko‘tariladi, yuqorida qutblar tomon oqadi, soviydi va pastga tushadi, so‘ng sirt bo‘ylab ekvatorga qaytadi. Bunday yopiq aylanma oqim <span class="t">Hadley yacheykasi</span> deyiladi.`,
 `Agar sayyora aylanmaganda, har bir yarimsharda bitta ulkan yacheyka — ekvatordan qutbgacha — hosil bo‘lardi. Ammo sayyora aylanadi va harakatlanayotgan havoga <span class="t">Koriolis kuchi</span> ta’sir qiladi: shimoliy yarimsharda harakat o‘ngga, janubiyda chapga og‘adi. Natijada Yerda har bir yarimsharda <b>uchta</b> yacheyka hosil bo‘ladi: Hadley (0–30°), Ferrel (30–60°) va qutb yacheykasi. Passat shamollari va g‘arbiy shamollar shu tizimning bir qismi.`,
 `Sayyoralarni taqqoslaylik. <b>Venera</b> juda sekin aylanadi (243 sutka) — u yerda Koriolis kuchi kuchsiz, shuning uchun har yarimsharda deyarli bitta ulkan Hadley yacheykasi bor. Qizig‘i shundaki, Venera atmosferasining yuqori qatlami sayyoradan 60 marta tez — atigi 4 sutkada aylanib chiqadi. Bu hodisa <span class="t">superrotatsiya</span> deyiladi.`,
 `<b>Mars</b> atmosferasi siyrak, shuning uchun u tez isib, tez soviydi: kecha-kunduz farqi 80–100 °C ga yetadi. Marsda butun sayyorani qoplaydigan chang bo‘ronlari bo‘ladi, qishda esa qutb qalpog‘ida CO₂ muzlab, atmosfera bosimi 25–30 % ga o‘zgaradi.`,
 `Tez aylanadigan <b>gigantlarda</b> (Yupiter — 9 soat 55 daqiqa) Koriolis kuchi juda katta, shuning uchun sirkulyatsiya ko‘plab tor <b>zona va belbog‘larga</b> bo‘linadi, ular orasida kuchli oqim — reaktiv shamollar esadi. Panelda aylanish tezligini o‘zgartirib, yacheykalar soni qanday ortishini kuzating.`
 ],
 main:'Sirkulyatsiyani notekis isish boshlaydi, Koriolis kuchi esa uni shakllantiradi: sekin aylanishda kam, tez aylanishda ko‘p yacheyka va polosa hosil bo‘ladi.',
 board:['Koriolis parametri: f = 2Ω·sin φ','Yer: 3 yacheyka/yarimshar (Hadley · Ferrel · qutb)','Venera: 1 yacheyka + superrotatsiya · Yupiter: ko‘p polosa'],
 ask:'Agar Yer 10 soatda aylanganida, shamollar tizimi qanday o‘zgarardi?'
},
dissipatsiya:{
 title:'Atmosfera dissipatsiyasi (sochilishi)',
 lecture:[
 `Nima uchun Oy va Merkuriyda deyarli atmosfera yo‘q, Yupiterda esa eng yengil gaz — vodorod ham saqlangan? Javob — <span class="t">dissipatsiya</span>, ya’ni atmosfera gazlarining sekin-asta koinotga “bug‘lanib” chiqib ketishi.`,
 `Gaz molekulalari doim harakatda va ularning tezliklari turlicha: ko‘pchiligi o‘rtacha tezlik atrofida, ozchiligi juda tez. Bu <span class="t">Maksvell taqsimoti</span>. O‘rtacha kvadratik tezlik v = √(3kT/m) — gaz qanchalik issiq va molekula qanchalik yengil bo‘lsa, shunchalik katta. Masalan, 1000 K da vodorod molekulasi ~3,5 km/s, azot esa ~0,9 km/s tezlikda harakatlanadi.`,
 `Molekula sayyoradan butunlay chiqib ketishi uchun uning tezligi <span class="t">qochish tezligidan</span> (ikkinchi kosmik tezlikdan) katta bo‘lishi kerak: v₂ = √(2GM/R). Yer uchun 11,2 km/s, Mars uchun 5,0 km/s, Oy uchun atigi 2,4 km/s, Yupiter uchun 59,5 km/s. Molekulalar atmosferaning eng yuqori qatlami — ekzosferadan chiqib ketadi, chunki u yerda ular to‘qnashmasdan erkin uchadi.`,
 `Amaliy qoida: agar qochish tezligi molekulalarning o‘rtacha kvadratik tezligidan <b>6 martadan ko‘p</b> bo‘lsa, gaz sayyorada milliardlab yil saqlanadi. Aks holda Maksvell taqsimotining “dumi”dagi tez molekulalar uzluksiz qochib, atmosfera asta-sekin yo‘qoladi. Bu <span class="t">Jins dissipatsiyasi</span> (termik dissipatsiya) deyiladi. Yer shu tarzda vodorod va geliyni yo‘qotgan, azot va kislorodni esa saqlab qolgan.`,
 `Dissipatsiyaning boshqa yo‘llari ham bor: <span class="t">Quyosh shamoli</span> magnit maydoni bo‘lmagan sayyoraning yuqori atmosferasini “sidirib” ketadi — Mars atmosferasining katta qismini shu tarzda yo‘qotgan (MAVEN apparati buni o‘lchagan). Yerni esa uning <span class="t">magnitosferasi</span> himoya qiladi. Panelda sayyora, gaz va haroratni tanlab, gaz saqlanadimi yoki yo‘qmi — o‘zingiz tekshiring.`
 ],
 main:'Gaz sayyorada saqlanishi uchun qochish tezligi molekulalarning o‘rtacha tezligidan ~6 marta katta bo‘lishi kerak; yengil gazlar va kichik sayyoralar atmosferani tez yo‘qotadi.',
 board:['v₂ = √(2GM/R):  Yer 11,2 · Mars 5,0 · Oy 2,4 · Yupiter 59,5 km/s','v_kv = √(3kT/m)','Shart: v₂ > 6·v_kv → gaz milliard yillab saqlanadi'],
 ask:'Titan (v₂ = 2,6 km/s) Oydan (2,4 km/s) deyarli farq qilmaydi, lekin uning qalin azot atmosferasi bor. Nima uchun?'
},
yeratmo:{
 title:'Yer tipidagi sayyoralar atmosferasi',
 lecture:[
 `Endi to‘rtta yer tipidagi sayyorani yonma-yon qo‘yamiz. Ular bir xil materialdan, deyarli bir xil sharoitda paydo bo‘lgan, lekin atmosferalari mutlaqo turlicha. Bu farqlarni tushunish — sayyorashunoslikning eng qiziqarli masalalaridan biri.`,
 `<b>Merkuriy</b>ning haqiqiy atmosferasi yo‘q — faqat juda siyrak <span class="t">ekzosfera</span> bor: natriy, kaliy, geliy, kislorod atomlari. Sabab: kichik massa (v₂ = 4,3 km/s), Quyoshga yaqinlik va kuchli Quyosh shamoli. Kunduzgi tomonida +430 °C, tungi tomonida −180 °C — atmosfera issiqlikni taqsimlamaydi.`,
 `<b>Venera</b> — Quyosh sistemasidagi eng issiq sayyora: sirtida 464 °C, garchi Quyoshga Merkuriydan ikki marta uzoq bo‘lsa ham! Atmosferasi 96,5 % CO₂ dan iborat, bosimi 92 bar, 48–70 km balandlikda sulfat kislota bulutlari bor. Bulutlar nurning 76 % ini qaytaradi, ammo yetib kelgan energiya infraqizil nur bo‘lib qochib keta olmaydi — bu kuchli <span class="t">issiqxona effekti</span>. Uning hisobiga harorat 500 darajadan ko‘proq ortadi.`,
 `<b>Yer</b> atmosferasi — 78 % azot, 21 % kislorod, 1 % argon, 0,04 % CO₂, bosimi 1 bar. Kislorod — hayotning mahsuli: u fotosintez natijasida to‘plangan. Yer CO₂ ning asosiy qismini okeanlar va karbonat jinslarida “qamab” qo‘ygan — shuning uchun Venera taqdiridan qutulgan. Mo‘’tadil issiqxona effekti o‘rtacha haroratni −18 °C dan +15 °C ga ko‘taradi.`,
 `<b>Mars</b> atmosferasi 95 % CO₂, lekin juda siyrak — 0,006 bar. O‘rtacha harorat −63 °C. Marsda qachonlardir suyuq suv oqqanining izlari — daryo o‘zanlari, delta va ko‘l yotqiziqlari bor. Ammo kichik massa, magnit maydonining yo‘qolishi va Quyosh shamoli tufayli Mars atmosferasining katta qismini yo‘qotgan. Xulosa: atmosferani <b>massa</b>, <b>Quyoshgacha masofa</b>, <b>magnit maydon</b> va <b>geologik jarayonlar</b> birgalikda shakllantiradi.`
 ],
 main:'Bir xil “boshlanish”dan keyin yer tipidagi sayyoralar atmosferasi massa, Quyoshgacha masofa, magnit maydon va issiqxona effekti tufayli butunlay turlicha bo‘lib ketgan.',
 board:['Venera: CO₂ 96,5 %, 92 bar, +464 °C','Yer: N₂ 78 %, O₂ 21 %, 1 bar, +15 °C · Mars: CO₂ 95 %, 0,006 bar, −63 °C','ΔT_issiqxona: Yer ≈ +33 K · Venera ≈ +500 K'],
 ask:'Nima uchun Yer Venera kabi “issiqxona do‘zaxiga” aylanib ketmadi?'
},
ichki:{
 title:'Yer tipidagi sayyoralarning ichki tuzilishi',
 lecture:[
 `Sayyora ichiga qarab bo‘lmaydi, eng chuqur quduq ham Yer radiusining 0,2 foiziga yetmaydi. Shunday ekan, ichki tuzilishni qanday bilamiz? Birinchi kalit — <b>o‘rtacha zichlik</b>. Yerning o‘rtacha zichligi 5,5 g/sm³, sirtdagi jinslarniki esa ~2,7–3 g/sm³. Demak, chuqurlikda ancha zich modda — <b>temir</b> bor.`,
 `Ikkinchi kalit — <span class="t">inersiya momenti</span>. Bir jinsli shar uchun C/MR² = 0,4. Massa markazga qanchalik to‘plangan bo‘lsa, bu son shunchalik kichik. Yer uchun 0,331, Mars uchun 0,366, Oy uchun 0,394 — demak, Yerning zich yadrosi katta, Oyniki esa juda kichik. Bu kattalik sayyoraning aylanish o‘qi pretsessiyasidan yoki kosmik apparat orbitasidan o‘lchanadi.`,
 `Uchinchi va eng kuchli kalit — <span class="t">seysmologiya</span>. Zilziladan ikki xil to‘lqin tarqaladi: bo‘ylama <b>P-to‘lqinlar</b> (qattiq, suyuq va gazdan o‘tadi) va ko‘ndalang <b>S-to‘lqinlar</b> (faqat qattiq jismdan o‘tadi). Yerning qarama-qarshi tomonida S-to‘lqinlar kuzatilmaydi — demak, Yerning <b>tashqi yadrosi suyuq</b>! 2019–2022-yillarda InSight apparati Marsda ham seysmik o‘lchovlar o‘tkazib, uning suyuq yadrosi radiusini (~1830 km) aniqladi.`,
 `Natijada Yer quyidagicha tuzilgan: <span class="t">po‘st</span> (5–70 km), <span class="t">mantiya</span> (2900 km gacha, issiq va sekin oquvchan silikatlar), suyuq tashqi yadro (5150 km gacha) va qattiq ichki yadro (markazda ~5400 °C). Suyuq temirning harakati — <b>geodinamo</b> — Yerning magnit maydonini hosil qiladi. Bunday qatlamlanish <span class="t">differensiatsiya</span> natijasi: yosh sayyora erigan holatda bo‘lganda og‘ir temir markazga cho‘kkan.`,
 `Boshqa sayyoralar: <b>Merkuriy</b>da temir yadro radiusning ~85 % ini egallaydi — u “temir sayyora”. <b>Venera</b> Yerga o‘xshash, lekin plitalar tektonikasi kuzatilmaydi va magnit maydoni yo‘q. <b>Mars</b>ning yadrosi suyuq, ammo magnit maydoni milliardlab yil oldin so‘ngan. <b>Oy</b>ning yadrosi juda kichik (~350 km). Kesimni tanlab, “Seysmik to‘lqinlar” tugmasini bosing.`
 ],
 main:'Ichki tuzilish o‘rtacha zichlik, inersiya momenti va seysmik to‘lqinlar orqali aniqlanadi: yer tipidagi sayyoralar temir yadro, silikat mantiya va po‘stdan iborat.',
 board:['ρ̄ = 3M / (4πR³):  Yer 5,51 · Merkuriy 5,43 · Mars 3,93 · Oy 3,34 g/sm³','C/MR²: bir jinsli shar 0,4 · Yer 0,331 · Mars 0,366 · Oy 0,394','S-to‘lqin suyuqlikdan o‘tmaydi → Yerning tashqi yadrosi suyuq'],
 ask:'Merkuriy Yerdan ancha kichik, lekin o‘rtacha zichligi deyarli bir xil. Bu uning ichki tuzilishi haqida nima deydi?'
},
gigant:{
 title:'Gigant sayyoralar atmosferasining tuzilishi',
 lecture:[
 `Gigant sayyoralarning <b>qattiq sirti yo‘q</b>: biz ko‘rayotgan “sirt” — bu bulutlarning yuqori qatlami. Shuning uchun balandlik bosim bilan o‘lchanadi va 1 bar sathi shartli “sirt” deb olinadi. Yupiter va Saturn atmosferasi asosan <b>vodorod (~86–90 %)</b> va <b>geliydan</b> iborat — tarkibi Quyoshnikiga yaqin. Bu ularning paydo bo‘lgan gaz-chang bulutidan gazni to‘g‘ridan-to‘g‘ri “yutib olganini” ko‘rsatadi.`,
 `Yupiter bulutlari uch qavat: eng yuqorida (~0,7 bar, −110 °C) oq <b>ammiak muzi</b> bulutlari, pastroqda (~2 bar) jigarrang <b>ammoniy gidrosulfid</b> (NH₄SH), yanada chuqurda (~5–7 bar) <b>suv</b> bulutlari. Har bir qatlam o‘sha moddaning kondensatsiya haroratida hosil bo‘ladi — xuddi Yerda suv bug‘idan bulut paydo bo‘lgani kabi.`,
 `Yupiter tez aylanadi va atmosfera parallel <span class="t">zona va belbog‘larga</span> bo‘linadi. Och rangli zonalarda gaz <b>ko‘tariladi</b> va ammiak bulutlari hosil bo‘ladi; to‘q belbog‘larda gaz <b>pastga tushadi</b> va chuqurroq qatlamlar ko‘rinadi. Ularning chegaralarida soatiga 500 km gacha shamollar esadi. <span class="t">Katta Qizil Dog‘</span> — kamida 190 yildan beri mavjud ulkan antitsiklon, uning eni Yer diametridan katta.`,
 `Gigantlar o‘zi ham issiqlik chiqaradi: Yupiter Quyoshdan olganidan ~1,7 marta, Saturn ~1,8–2 marta ko‘p energiya nurlantiradi. Bu <span class="t">ichki issiqlik</span> sayyora shakllanishidan qolgan va sekin qisqarish hisobiga ajraladi. U kuchli konveksiyani — bo‘ronlar va shamollarni harakatlantiradi. Chuqurlikda bosim millionlab barga yetadi va vodorod <span class="t">metall vodorodga</span> aylanadi — u elektr tokini o‘tkazadi va kuchli magnit maydon hosil qiladi.`,
 `<b>Uran</b> va <b>Neptun</b> — “<span class="t">muz gigantlari</span>”. Ularda vodorod-geliy qobig‘i yupqaroq, ichki qismi esa suv, ammiak va metan “muzlari”dan iborat. Atmosferadagi ~2 % <b>metan</b> qizil nurni yutadi — shuning uchun ular ko‘kish ko‘rinadi. Neptunda Quyosh sistemasidagi eng kuchli shamollar — soatiga 2000 km dan ortiq — kuzatilgan. Uran esa yon tomonga yotib aylanadi: uning o‘qi 98° og‘gan.`
 ],
 main:'Gigantlarning atmosferasi vodorod va geliydan iborat, qattiq sirti yo‘q; bulutlari qatlam-qatlam, tez aylanish va ichki issiqlik tufayli zona-belbog‘lar va ulkan girdoblar hosil bo‘ladi.',
 board:['Yupiter: H₂ ≈ 90 %, He ≈ 10 % (molekulalar soni bo‘yicha)','Bulutlar: NH₃ (0,7 bar) → NH₄SH (2 bar) → H₂O (5–7 bar)','L_ichki / L_yutilgan: Yupiter ≈ 1,7 · Saturn ≈ 1,8 · Neptun ≈ 2,6 · Uran ≈ 1,1'],
 ask:'Nima uchun Yupiterning zonalari oq, belbog‘lari esa to‘q rangda ko‘rinadi?'
},
kichik:{
 title:'Quyosh sistemasining kichik a’zolari',
 lecture:[
 `Sayyoralardan tashqari Quyosh sistemasida son-sanoqsiz kichik jismlar bor. Ular sistemaning “qurilish chiqindilari” — 4,6 milliard yil oldin sayyoralarga aylanmay qolgan materiallar. Shuning uchun ular Quyosh sistemasining eng qadimgi, deyarli o‘zgarmagan moddasini saqlaydi — xuddi arxeologlar uchun qazilma kabi.`,
 `<span class="t">Asteroidlar</span> — asosan toshli va metall jismlar, ularning ko‘pchiligi Mars va Yupiter orasidagi <b>asteroidlar kamarida</b> (2,1–3,3 a.b.) joylashgan. Eng kattasi — <b>Sera (Ceres)</b>, diametri ~940 km, u <span class="t">mitti sayyora</span> deb tasniflanadi. Kamardagi barcha asteroidlarning umumiy massasi Oy massasining atigi ~3 % ini tashkil qiladi. Yupiterning tortishishi bu yerda sayyora shakllanishiga yo‘l qo‘ymagan.`,
 `<span class="t">Kometalar</span> — muz va changdan iborat “iflos qor bo‘laklari” (bir necha km). Quyoshga yaqinlashganda muz sublimatsiyalanadi va yadro atrofida ulkan <b>koma</b> (100 ming km gacha) hamda <b>dumlar</b> paydo bo‘ladi. Ion dumi Quyosh shamoli ta’sirida doim Quyoshga <b>teskari</b> yo‘nalgan, chang dumi esa egilgan. Qisqa davrli kometalar Koyper kamaridan, uzoq davrlilari esa <span class="t">Oort bulutidan</span> keladi.`,
 `Neptundan narida, 30–50 a.b. da <span class="t">Koyper kamari</span> — muzli jismlar halqasi joylashgan. Uning eng mashhur a’zosi — <b>Pluton</b>: 2006-yilda u mitti sayyora deb tasniflangan, chunki o‘z orbitasini boshqa jismlardan “tozalamagan”. 2015-yilda New Horizons apparati Plutonda azot muzliklari va yupqa atmosferani kashf qildi.`,
 `Va nihoyat, <span class="t">meteor</span> jismlar — mayda zarralar. Ular Yer atmosferasiga 11–72 km/s tezlikda kirib, 70–120 km balandlikda yonib ketadi — buni biz “uchar yulduz”, ya’ni meteor sifatida ko‘ramiz. Agar jism yerga yetib kelsa, u <b>meteorit</b> deyiladi. Meteoritlar — tosh (xondritlar), temir va temir-tosh turlarga bo‘linadi; ularning yoshi 4,567 milliard yil — Quyosh sistemasining yoshi aynan shu orqali aniqlangan.`
 ],
 main:'Kichik jismlar — asteroidlar, kometalar, mitti sayyoralar va meteor jismlar — sayyoralar shakllanishidan qolgan eng qadimgi modda bo‘lib, Quyosh sistemasi tarixining “guvohlari”dir.',
 board:['Asteroidlar kamari: 2,1–3,3 a.b. · Koyper kamari: 30–50 a.b.','Oort buluti: ~2 000 – 100 000 a.b.','Meteoritlar yoshi: 4,567·10⁹ yil = Quyosh sistemasi yoshi'],
 ask:'Nima uchun kometa dumi hamma vaqt Quyoshga teskari tomonga yo‘nalgan, hatto kometa Quyoshdan uzoqlashayotganda ham?'
},
gipoteza:{
 title:'Quyosh sistemasining kelib chiqish gipotezalari',
 lecture:[
 `Har qanday kelib chiqish gipotezasi Quyosh sistemasining kuzatiladigan xossalarini tushuntirishi kerak: barcha sayyoralar <b>bir yo‘nalishda</b>, deyarli <b>bir tekislikda</b> va aylanaga yaqin orbitalarda aylanadi; ichki sayyoralar toshli, tashqilari gigant; Quyosh massaning 99,86 % iga ega, ammo sistemaning <span class="t">impuls momentining</span> atigi ~2 % iga egalik qiladi.`,
 `Birinchi ilmiy gipoteza — <b>Kant (1755) va Laplas (1796)</b>ning <span class="t">tumanlik gipotezasi</span>: aylanayotgan siyrak gaz bulut siqilib, tezroq aylanadi, yassilanadi va undan ajralgan halqalardan sayyoralar paydo bo‘ladi. U tekislik va bir yo‘nalishni tushuntirdi, lekin impuls momenti taqsimotini tushuntira olmadi. XX asr boshida <b>Jins</b> (1917) Quyosh yonidan o‘tgan yulduz uning moddasini sug‘urib olgan degan “to‘lqin” gipotezasini taklif qildi, ammo keyinchalik u rad etildi: qizigan gaz sayyoralarga yig‘ilmasdan tarqalib ketgan bo‘lardi.`,
 `1944-yilda <b>O. Yu. Shmidt</b> sayyoralar sovuq gaz-chang bulutidagi qattiq zarralarning yopishib, yig‘ilishidan paydo bo‘lgan degan g‘oyani ilgari surdi. Uning shogirdi <b>V. S. Safronov</b> (1969) bu jarayonning miqdoriy nazariyasini — <span class="t">planetezimallar</span> nazariyasini yaratdi. Bugungi zamonaviy nazariya Kant–Laplas va Shmidt–Safronov g‘oyalarining sintezidir.`,
 `Zamonaviy manzara: 4,6 milliard yil oldin molekulyar bulut bo‘lagi o‘z tortishishi bilan siqildi. Markazda proto-Quyosh, atrofida esa aylanuvchi <span class="t">protoplanetar disk</span> hosil bo‘ldi. Diskda chang zarralari yopishib, km o‘lchamli planetezimallarga, ular to‘qnashib protosayyoralarga aylandi — bu <span class="t">akkretsiya</span>. Bunday disklarni bugun boshqa yosh yulduzlar atrofida bevosita kuzatamiz (masalan, ALMA teleskopining HL Tauri tasviri).`,
 `Eng muhim kalit — <span class="t">muz chizig‘i</span> (~2,7–3 a.b., ~150 K). Undan ichkarida faqat tosh va metall qattiq holatda bo‘lgan — kichik toshli sayyoralar paydo bo‘ldi. Undan tashqarida suv, ammiak, metan muzlari ham qattiq bo‘lib, qattiq modda ko‘p edi — 10 Yer massasidan katta yadrolar tez o‘sib, disk gazini yutib oldi va gigantlarga aylandi. Quyosh esa magnit maydoni orqali impuls momentini diskka berib, sekinlashgan. Vaqt slayderini surib, butun jarayonni kuzating.`
 ],
 main:'Zamonaviy nazariya: Quyosh sistemasi 4,6 mlrd yil oldin aylanuvchi gaz-chang bulutdan paydo bo‘lgan; muz chizig‘i ichkarida toshli, tashqarida gigant sayyoralar hosil bo‘lishini belgilagan.',
 board:['Kant (1755) – Laplas (1796) → Jins (1917, rad etilgan) → Shmidt (1944) → Safronov (1969)','Bulut → disk → chang → planetezimallar → protosayyoralar → sayyoralar','Muz chizig‘i: ~2,7 a.b., T ≈ 150 K'],
 ask:'Nima uchun Laplas gipotezasi impuls momenti muammosiga duch keldi, zamonaviy nazariya esa uni qanday hal qiladi?'
},
taqqos:{
 title:'Quyosh sistemasi jismlarini taqqoslash',
 lecture:[
 `Endi o‘rganganlarimizni bir jadvalda yig‘amiz. Ekranda chapda — <b>yer tipidagi sayyora</b>, o‘rtada — <b>gigant sayyora</b>, o‘ngda — <b>kichik jism</b> (kometa). Har birini bosib, xususiyatlarini kuzating.`,
 `<b>Yer tipidagi sayyoralar</b>: kichik massa, katta zichlik, qattiq sirt, temir yadro, nisbatan yupqa (ikkilamchi) atmosfera, kam yo‘ldoshlar, halqalar yo‘q. Ularning atmosferasi vulkanlardan chiqqan gazlar va keyingi evolyutsiya mahsuli.`,
 `<b>Gigant sayyoralar</b>: katta massa, kichik zichlik, qattiq sirt yo‘q, qalin vodorod-geliy (birlamchi) atmosfera, tez aylanish, ko‘p yo‘ldoshlar va halqalar, kuchli magnit maydon, ichki issiqlik.`,
 `<b>Kichik jismlar</b>: atmosferasi deyarli yo‘q (kometalardan tashqari — ular Quyosh yonida vaqtinchalik koma hosil qiladi), noto‘g‘ri shakl, Quyosh sistemasining eng qadimgi, o‘zgarmagan moddasi. Bu farqlarning barchasi bitta sababga borib taqaladi — ular protoplanetar diskning turli joylarida, turli sharoitda paydo bo‘lgan.`
 ],
 main:'Yer tipidagi sayyoralar, gigantlar va kichik jismlar tabiatidagi farqlar ularning protoplanetar diskdagi o‘rni va massasi bilan tushuntiriladi.',
 board:['Yer tipi: ρ̄ katta, qattiq sirt, ikkilamchi atmosfera','Gigantlar: ρ̄ kichik, H₂–He, birlamchi atmosfera, halqalar','Kichik jismlar: eng qadimgi, o‘zgarmagan modda'],
 ask:'Yangi kashf etilgan ekzosayyoraning zichligi 1,2 g/sm³. U qaysi turga yaqin va qanday qo‘shimcha kuzatuv bilan buni tasdiqlash mumkin?'
},
yakun:{
 title:'Xulosa: bitta disk — turli olamlar',
 lecture:[
 `Bugungi darsning bosh g‘oyasi: Quyosh sistemasining barcha jismlari — issiq Venera, hayotga to‘la Yer, muzlagan Mars, ulkan Yupiter, ko‘kish Neptun va mitti kometalar — <b>bitta umumiy protoplanetar diskdan</b> paydo bo‘lgan. Ularning xilma-xilligi qonuniy: u Quyoshgacha masofa, massa va keyingi evolyutsiya bilan belgilanadi.`,
 `Biz ko‘rdikki, atmosferaning tabiati — bosim, harorat, sirkulyatsiya, dissipatsiya — oddiy fizik qonunlar bilan tushuntiriladi: barometrik formula, Koriolis kuchi, Maksvell taqsimoti, energiya balansi. Ichki tuzilish esa zichlik, inersiya momenti va seysmik to‘lqinlar orqali “ko‘rinadi”.`,
 `Bugun biz ~6000 dan ortiq <b>ekzosayyoralarni</b> bilamiz — boshqa yulduzlar atrofidagi sayyoralarni. Ular orasida “issiq Yupiterlar”, “super-Yerlar” va bizda yo‘q turlar bor. Quyosh sistemasini o‘rganib, biz ularni tushunish kalitini olamiz va aksincha.`,
 `Endi oxirgi parvozga tayyorlanamiz: kamera Yerdan uzoqlashib, butun Quyosh sistemasini va undan narini ko‘rsatadi. So‘ngra — mustahkamlash uchun “Kosmik detektiv” o‘yini.`
 ],
 main:'Quyosh sistemasining barcha jismlari bitta diskdan paydo bo‘lgan; ularning tabiatidagi farqlar umumiy fizik qonunlar bilan tushuntiriladi.',
 board:['Masofa + massa + evolyutsiya → sayyoraning tabiati','Atmosfera: H, Koriolis, Maksvell, issiqxona · Ichki: ρ̄, C/MR², seysmika'],
 ask:'Agar Yer Mars o‘rnida bo‘lganida, uning atmosferasi va iqlimi qanday bo‘lardi?'
},
lab:{
 title:'Sayyora laboratoriyasi',
 lecture:[
 `Bu — sizning shaxsiy <b>sayyora laboratoriyangiz</b>. Slayderlar bilan sayyoraning massasini, radiusini, Quyoshgacha masofasini va albedosini tanlang — sayyora real vaqtda o‘zgaradi.`,
 `Tizim bir vaqtda bir nechta kattalikni hisoblaydi: <b>o‘rtacha zichlik</b> (sayyora turi uchun asosiy belgi), <b>sirtdagi erkin tushish tezlanishi</b>, <b>qochish tezligi</b>, <b>muvozanat harorati</b> va qaysi gazlarni sayyora milliardlab yil saqlay olishi.`,

const EXPLAIN = {
l7dop:{t:'δν = 4ν₀·Ω·r / c',h:`<p>Qaytgan signalda Dopler siljishi ikki marta qo‘shiladi: Δν = 2ν₀v/c. Halqaning ikki chetida nuriy tezliklar qarama-qarshi, shuning uchun cho‘qqilar farqi δν = 4ν₀v/c, v = Ω·r.</p><p>Bundan Ω = cδν/(4ν₀r), P = 2π/Ω. Merkuriy chetlari uchun ν₀ = 430 MHz da δν_max ≈ 17 Hz.</p>`},
 l7ring:{t:'r = √(2Rh − h²),  h = cτ/2',h:`<p>τ kechikish bilan qaytgan signal subradar nuqtadan h = cτ/2 “chuqurlikdagi” halqadan keladi. Halqa radiusi sfera geometriyasidan: r² = R² − (R − h)² = 2Rh − h².</p>`},
l6plank:{t:'F_λ = (c₁/λ⁵)/[e^{c₂/λT} − 1]',h:`<p><b>Plank formulasi</b> — absolyut qora jism sirtining birlik yuzasidan birlik to‘lqin uzunligi oralig‘ida chiqayotgan oqim. c₁ = 2πhc² = 3,742·10⁻¹⁶ W·m², c₂ = hc/k = 1,439·10⁻² m·K.</p><p>Uzun to‘lqinlarda Reley–Jins (F ≈ 2πckT/λ⁴), qisqa to‘lqinlarda Vin taqsimotiga o‘tadi. Maksimumi λ_max·T = 2,898·10⁻³ m·K; fotonlar soni N_λ = F_λ·λ/(hc).</p>`},
 l6bolz:{t:'N_n/N₁ = n²·exp(−U_n/kT)',h:`<p><b>Bolsman formulasi</b>: n-sathdagi atomlar ulushi. n² — statistik vazn (g_n = 2n²), U_n = 13,598·(1 − 1/n²) eV — qo‘zg‘alish potensiali. T = 6000 K da N₂/N₁ ≈ 1,1·10⁻⁸.</p><p>Saxa formulasi bilan birga: Balmer chiziqlari ≈ 10 000 K da eng kuchli (A0 sinf).</p>`},
 au:{t:'1 a.b. ≈ 1,496·10⁸ km',h:`<p><b>Astronomik birlik</b> — Yerdan Quyoshgacha o‘rtacha masofa. Yorug‘lik uni ~8 daqiqa 20 soniyada bosib o‘tadi.</p><p>Quyosh sistemasida masofalarni a.b. da o‘lchash qulay: Merkuriy 0,39 a.b., Yupiter 5,2 a.b., Neptun 30 a.b.</p>`},
 kepler3:{t:'M = 4π²a³ / (GT²)',h:`<p>Keplerning uchinchi qonunining Nyuton ko‘rinishi. Yo‘ldoshning orbita radiusi <b>a</b> va aylanish davri <b>T</b> ma’lum bo‘lsa, markaziy jism — sayyora massasi <b>M</b> topiladi. G = 6,674·10⁻¹¹ N·m²/kg².</p><p>Masalan, Ioning orbitasidan Yupiter massasi: M ≈ 1,9·10²⁷ kg (Yerdan 318 marta ko‘p).</p><p><b>Talabaga:</b> yo‘ldoshi yo‘q sayyoralar (Merkuriy, Venera) massasi faqat kosmik apparatlar uchib o‘tganidan keyin aniq o‘lchangan.</p>`},
 albedo:{t:'A = Φ_qaytgan / Φ_tushgan',h:`<p><b>Albedo</b> — jism unga tushgan nurning qancha qismini qaytarishini ko‘rsatadi (0 dan 1 gacha).</p><p>Venera ≈ 0,76 (oq bulutlar), Yer ≈ 0,30, Mars ≈ 0,25, Oy ≈ 0,11, Merkuriy ≈ 0,07. Albedo sirt yoki bulut tarkibi haqida ma’lumot beradi va muvozanat haroratiga bevosita ta’sir qiladi.</p>`},
 radar:{t:'d = c·τ / 2',h:`<p><b>Radiolokatsiya</b>: radio impuls sayyoragacha borib qaytadi. τ — borib-qaytish vaqti, c — yorug‘lik tezligi. Masofa d = cτ/2.</p><p>Qaytgan signal chastotasining kengayishi (Doppler effekti) sayyoraning aylanish tezligini beradi — shu tarzda Veneraning 243 sutkalik teskari aylanishi aniqlangan.</p>`},
 baro:{t:'p(h) = p₀·e^(−h/H)',h:`<p><b>Barometrik formula</b>: izotermik atmosferada bosim balandlik bo‘yicha eksponensial kamayadi. p₀ — sirtdagi bosim, H — balandlik shkalasi.</p><p>Har H balandlikda bosim e ≈ 2,72 marta kamayadi. Yer uchun 8,5 km da 0,37 bar, 17 km da 0,14 bar, Everest cho‘qqisida (~8,8 km) ~0,33 bar.</p>`},
 scaleH:{t:'H = RT / (μg)',h:`<p><b>Balandlik shkalasi</b>. R = 8,314 J/(mol·K) — universal gaz doimiysi, T — harorat, μ — molyar massa (kg/mol), g — erkin tushish tezlanishi.</p><p>Yer: T ≈ 250 K, μ = 0,029, g = 9,8 → H ≈ 7,3–8,5 km. Venera: T ≈ 700 K, μ = 0,044, g = 8,9 → H ≈ 15 km (pastki qatlamda). Mars: T ≈ 210 K, μ = 0,044, g = 3,7 → H ≈ 11 km.</p><p><b>Ma’nosi:</b> issiq, yengil va kuchsiz tortilgan atmosfera — “baland”.</p>`},
 teq:{t:'T_muv ≈ 278 K·(1 − A)^¼ / √r',h:`<p><b>Muvozanat harorati</b>: sayyora Quyoshdan yutgan energiya (πR²·(1−A)·S) o‘zi butun sirtidan nurlatgan energiyaga (4πR²·σT⁴) teng deb olinadi. r — a.b. dagi masofa.</p><p>Yer: A = 0,30 → 255 K (−18 °C), haqiqiy 288 K. Venera: A = 0,76 → ~230 K, haqiqiy 737 K! Mars: ~210 K, haqiqiy ~210 K (issiqxona deyarli yo‘q).</p><p>Haqiqiy va hisoblangan harorat farqi — issiqxona effekti o‘lchovi.</p>`},
 coriolis:{t:'f = 2Ω·sin φ',h:`<p><b>Koriolis parametri</b>. Ω — sayyoraning aylanish burchak tezligi, φ — kenglik. Koriolis tezlanishi a = 2Ω·v·sin φ.</p><p>Ekvatorda (φ = 0) gorizontal harakatga ta’sir yo‘q, qutblarda maksimal. Ω qancha katta bo‘lsa (tez aylanish), oqimlar shunchalik kuchli og‘adi va tor polosalarga bo‘linadi.</p><p>Yer: Ω = 7,29·10⁻⁵ s⁻¹; Yupiter: 1,76·10⁻⁴ s⁻¹ (2,4 marta tez); Venera: 3·10⁻⁷ s⁻¹ (240 marta sekin).</p>`},
 vesc:{t:'v₂ = √(2GM/R)',h:`<p><b>Ikkinchi kosmik tezlik</b> (qochish tezligi) — jism sayyora tortishishidan butunlay chiqib ketishi uchun kerak bo‘lgan minimal tezlik. U kinetik energiya mv²/2 potensial energiya GMm/R ga teng bo‘lgan shartdan kelib chiqadi.</p><p>Oy 2,38 · Merkuriy 4,25 · Mars 5,03 · Venera 10,36 · Yer 11,19 · Uran 21,3 · Neptun 23,5 · Saturn 35,5 · Yupiter 59,5 km/s.</p>`},
 vrms:{t:'v_kv = √(3kT/m)',h:`<p>Gaz molekulalarining <b>o‘rtacha kvadratik tezligi</b>. k = 1,38·10⁻²³ J/K — Bolsman doimiysi, m — molekula massasi.</p><p>1000 K da: H₂ — 3,5 km/s; He — 2,5 km/s; H₂O — 1,2 km/s; N₂ — 0,94 km/s; CO₂ — 0,75 km/s. Tezlik √(T/m) ga proporsional: vodorod azotdan 3,7 marta tez.</p>`},
 jeans:{t:'v₂ > 6·v_kv',h:`<p><b>Atmosferani saqlash sharti</b> (amaliy qoida). Maksvell taqsimotida tezligi o‘rtachadan 6 marta katta molekulalar ulushi juda kam, shuning uchun gaz ~4,5 mlrd yil davomida deyarli qochib ketmaydi.</p><p>Agar nisbat ~4 dan kichik bo‘lsa, gaz geologik nuqtai nazardan tez (milliondan yuz million yilgacha) yo‘qoladi. Aniqroq bahoda <b>Jins parametri</b> λ = v₂² / v₀² ishlatiladi (v₀ — eng ehtimolli tezlik).</p><p><b>Muhim:</b> hisobda sirt emas, <b>ekzosfera</b> harorati olinadi — Yerda u 700–1400 K.</p>`},
 greenhouse:{t:'ΔT = T_haqiqiy − T_muv',h:`<p><b>Issiqxona effekti</b> o‘lchovi. Ko‘rinadigan Quyosh nuri atmosferadan o‘tib sirtni isitadi; sirt esa infraqizil nur chiqaradi, uni CO₂, H₂O, CH₄ yutib, qaytadan pastga ham nurlantiradi. Natijada sirt isiydi.</p><p>Yer: 288 − 255 = <b>+33 K</b>. Venera: 737 − 230 ≈ <b>+500 K</b> (92 bar CO₂!). Mars: ~+5 K (atmosfera juda siyrak).</p>`},
 rho:{t:'ρ̄ = 3M / (4πR³)',h:`<p><b>O‘rtacha zichlik</b> — massa hajmga bo‘linadi. Sayyora tarkibining birinchi va eng oddiy ko‘rsatkichi.</p><p>Yer 5,51 · Merkuriy 5,43 · Venera 5,24 · Mars 3,93 · Oy 3,34 · Yupiter 1,33 · Saturn 0,69 · Uran 1,27 · Neptun 1,64 g/sm³.</p><p>Sirt jinslari ~2,7–3,3 g/sm³ — demak, yer tipidagi sayyoralarda ichkarida og‘irroq (temir) modda bor.</p>`},
 moi:{t:'C / MR²',h:`<p><b>Inersiya momenti omili</b>. C — qutb o‘qiga nisbatan inersiya momenti. Bir jinsli shar uchun 0,4; massa markazga to‘plangan sari kichrayadi; ingichka sferik qobiq uchun 0,667.</p><p>Yer 0,331 · Merkuriy 0,346 · Mars 0,366 · Oy 0,394 · Yupiter 0,254 · Saturn 0,21.</p><p>U pretsessiya tezligidan yoki kosmik apparat orbitasining o‘zgarishidan o‘lchanadi.</p>`},
 seismic:{t:'v_P > v_S;   S suyuqlikdan o‘tmaydi',h:`<p><b>Seysmik to‘lqinlar</b>. P (bo‘ylama, siqilish) to‘lqinlari har qanday muhitdan o‘tadi va tezroq (5–13 km/s). S (ko‘ndalang, siljish) to‘lqinlari faqat qattiq jismdan o‘tadi, chunki suyuqlik siljishga qarshilik ko‘rsatmaydi.</p><p>Yer markazidan 104° dan katta burchak masofada S-to‘lqinlar kuzatilmaydi — <b>seysmik soya</b>. Bu tashqi yadroning suyuqligini isbotlaydi (Oldham 1906, Gutenberg 1913). Ichki yadro qattiqligini Inge Leman (1936) kashf qilgan.</p>`},
 clouds:{t:'NH₃ → NH₄SH → H₂O',h:`<p>Yupiterning <b>bulut qatlamlari</b> chuqurlik bo‘yicha: ammiak muzi (~0,7 bar, ~150 K), ammoniy gidrosulfid (~2 bar, ~200 K), suv muzi/tomchilari (~5–7 bar, ~270 K).</p><p>Har bir modda o‘zining <b>kondensatsiya haroratida</b> bulut hosil qiladi — chuqurlashgan sari harorat ortadi, shuning uchun tartib shunday.</p>`},
 internal:{t:'L_ichki / L_yutilgan ≈ 1,7',h:`<p>Yupiter Quyoshdan olgan energiyasidan ~1,7 marta ko‘p nurlantiradi. Qo‘shimcha energiya — <b>ichki issiqlik</b>: shakllanishdan qolgan issiqlik va sayyoraning sekin qisqarishi (yiliga ~1–2 sm) natijasida tortishish energiyasining ajralishi (Kelvin–Gelmgols mexanizmi).</p><p>Saturnda qo‘shimcha manba — geliy tomchilarining chuqurga “yomg‘ir” bo‘lib cho‘kishi. Uranda ichki issiqlik deyarli yo‘q (~1,06).</p>`},
 snow:{t:'Muz chizig‘i: T ≈ 150 K, r ≈ 2,7 a.b.',h:`<p><b>Muz (qor) chizig‘i</b> — protoplanetar diskda harorat suv muzlashi uchun yetarlicha past (~150–170 K, vakuumda) bo‘lgan masofa. Undan tashqarida qattiq modda (muz + tosh) ichkaridagidan 3–4 marta ko‘p.</p><p>Shu sababli gigant sayyoralarning yadrolari tez o‘sib, disk gazini yutib olishga ulgurgan.</p>`},
 angmom:{t:'L = m·v·r;   Quyosh: 99,86 % massa, ~2 % L',h:`<p><b>Impuls momenti muammosi</b>. Quyosh sistemasi massasining deyarli hammasi Quyoshda, ammo impuls momentining 98 % i sayyoralarda (asosan Yupiter va Saturnda).</p><p>Laplas gipotezasida siqilayotgan Quyosh juda tez aylanishi kerak edi. Zamonaviy yechim: yosh Quyoshning magnit maydoni impuls momentini diskka va yulduz shamoliga uzatib, uni sekinlashtirgan (“magnit tormozlanish”).</p>`},
 nebula:{t:'Bulut → disk → planetezimal → sayyora',h:`<p>Zamonaviy kelib chiqish ssenariysi va vaqt shkalasi:</p><p>• Bulut siqilishi: ~100 ming yil<br>• Protoplanetar disk: 1–10 mln yil (gaz shu vaqtda tarqaladi)<br>• Planetezimallar (1–100 km): ~100 ming yil<br>• Gigantlar yadrosi va gaz akkretsiyasi: 1–10 mln yil<br>• Yer tipidagi sayyoralar: 10–100 mln yil</p><p>Eng qadimgi qattiq zarralar (meteoritlardagi CAI) yoshi 4,567 mlrd yil.</p>`}
};

 const c=document.createElement('canvas'),ctx=c.getContext('2d');

 const W=Math.ceil(Math.min(maxW+pad*2,4096)),H=Math.ceil(lines.length*lineH+pad*2-(lineH-size)*.6);

class Shape{

const packCache=new Map();
function packPositions(A,seed=7){

 const R=0.6*Math.cbrt(A),ga=Math.PI*(3-Math.sqrt(5)),r=rng(seed*977+A);

 for(let k=0;k<it;k++){
  for(const p of pts)p.multiplyScalar(0.985);
  for(let i=0;i<A;i++){const a=pts[i];for(let j=i+1;j<A;j++){const b=pts[j];const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;const d2=dx*dx+dy*dy+dz*dz;if(d2<minD*minD){const d=Math.sqrt(d2)||1e-3;const pu=(minD-d)*.5/d;a.x-=dx*pu;a.y-=dy*pu;a.z-=dz*pu;b.x+=dx*pu;b.y+=dy*pu;b.z+=dz*pu;}}}
 }
 const c=V3();pts.forEach(p=>c.add(p));c.divideScalar(A);pts.forEach(p=>p.sub(c));
 packCache.set(key,pts);return pts;
}
class Nucleus{
 constructor(o={}){

  const isP=new Array(A).fill(false);for(let k=0;k<Z;k++)isP[idx[k]]=true;

function playCine(dur,fn,onEnd){cine={t:0,dur,fn,onEnd};controls.enabled=false;}
function runCine(dt){cine.t+=dt;const k=Math.min(cine.t/cine.dur,1);const r=cine.fn(k,cine.t);camera.position.copy(r.pos);controls.target.copy(r.target);camera.lookAt(r.target);const f=r.fov||55;if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix();}if(k>=1){const e=cine.onEnd;cine=null;controls.enabled=true;if(camera.fov!==55){camera.fov=55;camera.updateProjectionMatrix();}e&&e();}}
function hideOthers(){stations.forEach((s,j)=>{if(j!==cur&&!s.keep)s.group.visible=false;});}
function goTo(i,opt={}){
 i=clamp(i,0,stations.length-1);if(i===cur&&!opt.force)return;if(cine&&cine.lock)return;
 const prev=cur;if(prev>=0&&prev!==i&&stations[prev].onLeave)stations[prev].onLeave();
 cur=i;const s=stations[i];s.group.visible=true;s.visited=true;if(s.onEnter)s.onEnter();renderUI();
 const to=stationWorld(i);
 if(opt.instant||prev<0){camera.position.copy(to.pos);controls.target.copy(to.target);camera.lookAt(to.target);hideOthers();if(s.onArrive)s.onArrive();return;}
 const p0=camera.position.clone(),t0=controls.target.clone(),dist=p0.distanceTo(to.pos);const dur=clamp(1.9+dist/520,1.9,4.2);

 playCine(dur,k=>{const e=ease(k);const a=p0.clone().lerp(mid,e),b=mid.clone().lerp(to.pos,e);return{pos:a.lerp(b,e),target:t0.clone().lerp(to.target,ease(clamp(k*1.25-.1,0,1))),fov:55+Math.sin(Math.PI*k)*16};},()=>{flying=false;hideOthers();if(s.onArrive)s.onArrive();});
}

function updateTags(t){
 const blocked=document.body.classList.contains('intro')||document.body.classList.contains('cinema');const sideL=innerWidth-(($('#side').offsetWidth||392)+24);
 for(const f of FTAGS){f.sp.position.y=f.sp.userData.base.y+Math.sin(t*.8+f.ph)*.12;
  const show=!blocked&&!cine&&f.st===stations[cur]&&f.st.group.visible&&f.sp.visible&&f.sp.material.opacity>.5;
  if(!show){f.el.style.display='none';continue;}
  f.sp.getWorldPosition(_v);_v.y-=f.sp.scale.y*.56;_v.project(camera);
  if(_v.z>1||Math.abs(_v.x)>1.02||Math.abs(_v.y)>1.02){f.el.style.display='none';continue;}

  f.el.style.display='block';f.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,0)';}
}

    const col=type==='P'?0xffe066:0x7fe3ff;const off=type==='P'?.03:.05;pts=pts.map(p=>p.clone().setZ(off));const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.35}));s.disk.add(l);

 g.fillStyle='#92a3c8';g.font=(10*k)+'px sans-serif';[4000,5000,6000].forEach(l=>g.fillText(l+' Å',(l-3800)/3100*W-12*k,H-3*k));

CONTENT.l3={title:'L3: Yulduzlar spektri va spektral sinflash',lecture:[`Yulduz spektri — fotosferadan chiqqan <b>tutash spektr</b> fonidagi qorong‘i <span class="t">yutilish (Fraungofer) chiziqlari</span>. Yulduzlarning kimyoviy tarkibi deyarli bir xil (asosan vodorod va geliy), ammo spektrlari keskin farq qiladi. Sababi — <b>temperatura</b>: u atomlarning qo‘zg‘alishini (Bolsman) va ionlanishini (Saxa) belgilaydi.`,`Shuning uchun vodorodning Balmer chiziqlari <b>A sinfda</b> eng kuchli: issiqroq yulduzda vodorod ionlashadi, sovuqroqda esa ikkinchi sathda atomlar kam. Ca II H va K chiziqlari esa G–K sinflarda eng kuchli. Sinflar temperatura kamayishi bo‘yicha: <b>O B A F G K M</b>. Yorqinlik sinfi (I–V) chiziqlar kengligidan aniqlanadi: gigantlarda atmosfera siyrak, chiziqlar ingichka.`,`Spektrdan sinf va yorqinlik sinfi topilsa, G–R diagrammasidan M_V olinadi, so‘ng <b>spektral parallaks</b>: lg r = 0,2(m − M) + 1. Rang ko‘rsatkichi B−V dan T_eff, yorqinlikdan Stefan–Bolsman orqali radius: R/R☉ = (T☉/T)²·√(L/L☉).`],main:'Yulduz spektrining ko‘rinishini asosan temperatura belgilaydi, kimyoviy tarkib emas. Spektr → sinf → M_V → masofa.',board:['O B A F G K M — T kamayadi','W = ∫(1 − F_λ/F_c)dλ','M = m + 5 + 5 lg π','L/L☉ = 10^0,4(4,74 − M_bol)','R/R☉ = (T☉/T)²·√(L/L☉)'],ask:'Nima uchun Quyoshdagi vodorod chiziqlari kuchsiz, ammo Quyosh vodoroddan iborat?'};
THINK.l3=[{q:'❓ Nima uchun A sinf yulduzlarida vodorod chiziqlari eng kuchli?',a:'Balmer chiziqlari uchun vodorod <b>2-sathda</b> bo‘lishi kerak. Past T da atomlar asosan 1-sathda (kam qo‘zg‘algan), juda yuqori T da vodorod <b>ionlashib</b> ketadi. Ikkala jarayon (Bolsman va Saxa) A0 atrofida ≈ 10 000 K da eng yaxshi muvozanatga keladi.'}];

term({id:'albedo',name:'Albedo',cat:'Tekshirish usullari',keys:['albedo'],st:'usullar',period:9,cam:[0,2,14],
 def:'<b>Albedo</b> — jism unga tushgan nurning qancha qismini qaytarishini ko‘rsatuvchi son (0–1). Qorong‘i Oy nurning ~11 % ini, oq bulutli Venera ~76 % ini qaytaradi. Albedo sirt tarkibini va sayyora haroratini aniqlashda muhim.',f:'A = Φ_qaytgan / Φ_tushgan',
 steps:[[0,'Ikkala jismga bir xil Quyosh nuri tushmoqda'],[3,'Oy nurning ko‘p qismini yutadi — kam qaytaradi'],[5.5,'Venera bulutlari nurning ko‘p qismini qaytaradi']],
 build(g){const A=tPlanet(g,'oy',2.2,{atm:false}),B=tPlanet(g,'venera',2.2);A.group.position.x=-4.5;B.group.position.x=4.5;const lanes=[];[[A,-4.5,1],[B,4.5,7]].forEach(([P,x,nr])=>{for(let i=0;i<9;i++){const p=glow(0xffe066,.7,1);g.add(p);lanes.push({p,x,i,ref:i<nr,y:(i%3-1)*1.1,z:(Math.floor(i/3)-1)*1.1});}});
  tlab(g,'Oy:  A ≈ 0,11',V3(-4.5,3.6,0),{worldH:.6});tlab(g,'Venera:  A ≈ 0,76',V3(4.5,3.6,0),{worldH:.6,color:'#ffe7b0'});
  return(t,dt,k)=>{A.update(t);B.update(t);lanes.forEach(l=>{const f=((k*.45+l.i*.07)%1);const hit=V3(l.x-Math.sqrt(Math.max(.2,4.84-l.y*l.y-l.z*l.z)),l.y,l.z);if(f<.5){l.p.position.copy(V3(l.x-9,l.y+4,l.z)).lerp(hit,f*2);l.p.material.color.setHex(0xffe066);l.p.material.opacity=1;}else{const q=(f-.5)*2;if(l.ref){l.p.position.copy(hit).lerp(V3(l.x-2,l.y+1,9),q);l.p.material.color.setHex(0xffffff);l.p.material.opacity=1-q*.5;}else l.p.material.opacity=0;}});};}});

term({id:'spektr',name:'Spektral tahlil',cat:'Tekshirish usullari',keys:['spektral','spektroskopiya','spektr','yutilish chiziq'],st:'usullar',period:9,cam:[0,2,15],
 def:'Nur atmosferadan o‘tganda har bir gaz faqat o‘ziga xos to‘lqin uzunliklarni yutadi. Natijada spektrda <b>qora yutilish chiziqlari</b> paydo bo‘ladi — ular gazning “barmoq izi”. Shu tarzda sayyoraga bormasdan uning atmosfera tarkibini bilamiz.',

 build(g){const st=new THREE.Group();st.add(glow(0xffffff,2.5,1));st.position.set(-10,0,0);g.add(st);const P=tPlanet(g,'mars',2.2);P.group.position.set(-3,-2.2,0);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));g.add(beam);
  const prism=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.6,3),new THREE.MeshPhongMaterial({color:0xbfe8ff,transparent:true,opacity:.45,shininess:120}));prism.rotation.x=Math.PI/2;prism.position.set(3,0,0);g.add(prism);
  const fan=[0xff3030,0xffa020,0xffee30,0x40ff60,0x30a0ff,0x8040ff].map((c,i)=>{const l=lineBetween(V3(3.6,0,0),V3(9,2.2-i*.88,0),c,.8);g.add(l);return l;});
  const sc1=new THREE.Mesh(new THREE.PlaneGeometry(6,1.2),new THREE.MeshBasicMaterial({map:spectrumTex([]),transparent:true}));const sc2=new THREE.Mesh(new THREE.PlaneGeometry(6,1.2),new THREE.MeshBasicMaterial({map:spectrumTex([.18,.22,.62,.66,.69,.83]),transparent:true,opacity:0}));[sc1,sc2].forEach(m=>{m.position.set(6,4,0);g.add(m);});
  const lb=tlab(g,'CO₂   CO₂       H₂O  CH₄',V3(6,5.1,0),{worldH:.45,color:'#ffe7b0'});
  return(t,dt,k)=>{P.update(t);const a=V3(-10,0,0),b=V3(3,0,0);beam.position.copy(a).lerp(b,.5);beam.scale.y=a.distanceTo(b)*sstep(0,1.5,k);beam.position.x=a.x+beam.scale.y/2;beam.quaternion.setFromUnitVectors(UP,V3(1,0,0));const v=sstep(1.5,2.2,k);fan.forEach(l=>l.material.opacity=.8*v);const ab=sstep(4.5,5.5,k);sc1.material.opacity=v*(1-ab);sc2.material.opacity=v*ab;lb.material.opacity=ab;prism.rotation.y=t*.3;};}});

term({id:'radar',name:'Radiolokatsiya',cat:'Tekshirish usullari',keys:['radiolokatsiya','radar'],st:'usullar',period:8,cam:[0,3,16],

 steps:[[0,'Antenna radio impuls yuboradi'],[2.5,'Impuls sayyoraga yetib, qaytadi'],[5,'Qaytish vaqti τ → masofa d = cτ/2']],
 build(g){const ant=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,16,0,TAU,0,Math.PI*.35),new THREE.MeshStandardMaterial({color:0xdde4f0,metalness:.6,roughness:.3,side:THREE.DoubleSide}));ant.rotation.z=-Math.PI/2;ant.position.set(-9,0,0);g.add(ant);
  const P=tPlanet(g,'venera',2.5);P.group.position.x=7;const pulse=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshBasicMaterial({color:0x7fe3ff,wireframe:true,transparent:true,opacity:.4}));g.add(pulse);
  const o={size:56,font:FONT_SERIF,color:'#ffffff',card:true,worldH:.65};const tl=tlab(g,'',V3(0,4,0),o);

   setSpriteTextCached(tl,'τ = '+fmt(f*4.6,1)+' daq   →   d ≈ '+Math.round(f*4.6*60*3e5/2/1e6)+' mln km',o);};}});

term({id:'okkult',name:'Okkultatsiya (yulduz qoplanishi)',cat:'Tekshirish usullari',keys:['okkultatsiya'],st:'usullar',period:12,cam:[0,0,15],

 steps:[[0,'Atmosferali sayyora yulduz oldidan o‘tmoqda'],[3,'Yulduz yorqinligi asta-sekin pasayadi'],[6,'Atmosferasiz jism: yulduz birdan so‘nadi'],[9,'Egri chiziq shakli — atmosfera haqida ma’lumot']],
 build(g){const P=tPlanet(g,'titan',2.5);P.group.position.y=1.5;const star=new THREE.Group();star.add(glow(0xffffff,2,1));star.add(glow(0x9fd0ff,4.5,.6));star.position.set(0,1.5,-6);g.add(star);

  return(t,dt,k)=>{const atm=k<6;P.atm.visible=atm;P.update(t*.2);const q=(k%6)/6;const x=lerp(9,-9,q);P.group.position.x=x;const d=Math.abs(x);const v=atm?(d>3.4?1:d<2.4?0:(d-2.4)):(d>2.5?1:0);star.children.forEach(c=>c.material.opacity=v*(c===star.children[1]?.6:1));
   const arr=atm?curve:curve2;const n=Math.floor(q*80);arr[Math.min(79,n)].position.set(lerp(-8,8,q),-5+v*1.6+(atm?0:-.05),0);arr[Math.min(79,n)].material.opacity=1;if(k<.05){curve.forEach(s=>s.material.opacity=0);curve2.forEach(s=>s.material.opacity=0);}};}});

   const rr=R*1.04+alt*1.1;const L=lat*o.hem;pos[i*3]=rr*Math.cos(L);pos[i*3+1]=rr*Math.sin(L);pos[i*3+2]=o.z+1.8;const hot=1-lat/(Math.PI/2);col[i*3]=lerp(.4,1,hot);col[i*3+1]=lerp(.7,.55,hot);col[i*3+2]=lerp(1,.3,hot);});geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;};}});

 build(g){const P=tPlanet(g,'mars',3,{atm:false});const N=160,pos=new Float32Array(N*3),col=new Float32Array(N*3);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));g.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.25,map:TEX_DOT,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));

term({id:'qochish',name:'Qochish tezligi (ikkinchi kosmik tezlik)',cat:'Atmosfera',keys:['qochish tezlig','kosmik tezlik'],st:'dissipatsiya',period:12,cam:[0,2,20],

 build(g){const P=tPlanet(g,'yer',4);const GM=1;const R=4;const paths=[.5,.62,.707,1.0].map(f=>{const v1=Math.sqrt(GM/(R+.3));const pts=[];let p=V3(0,R+.3,0),v=V3(v1*f/.707,0,0);for(let i=0;i<4000&&pts.length<700;i++){const r=p.length();if(r<R)break;if(r>18)break;const a=p.clone().multiplyScalar(-GM*1.0/(r*r*r));v.addScaledVector(a,.02*20);p.addScaledVector(v,.02*20);if(i%2===0)pts.push(p.clone());if(f>.7&&f<.75&&pts.length>2&&i>40&&p.distanceTo(V3(0,R+.3,0))<.3)break;}return pts;});
  const cols=[0xff8a7a,0xffb070,0x4ef2b0,0x7fe3ff];const lines=paths.map((pts,i)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.length>1?pts:[V3(),V3()]),new THREE.LineBasicMaterial({color:cols[i]}));l.geometry.setDrawRange(0,0);g.add(l);return l;});const ball=new THREE.Group();ball.add(tball(0xffffff,.2,1));g.add(ball);
  const mt=new THREE.Mesh(new THREE.ConeGeometry(.6,.8,12),new THREE.MeshStandardMaterial({color:0x8a7a5a}));mt.position.y=R+.1;g.add(mt);const o={size:54,font:FONT_SERIF,color:'#fff',card:true,worldH:.65};const tl=tlab(g,'',V3(0,-5.4,0),o);
  return(t,dt,k)=>{P.update(t*.2);const i=Math.min(3,Math.floor(k/3));const f=(k%3)/3;lines.forEach((l,j)=>{const n=paths[j].length;l.geometry.setDrawRange(0,j<i?n:j===i?Math.floor(n*f):0);});const pth=paths[i];if(pth.length)ball.position.copy(pth[Math.min(pth.length-1,Math.floor(pth.length*f))]);setSpriteTextCached(tl,['v = 4 km/s — qaytib tushadi','v = 6 km/s — uzoqroqqa tushadi','v₁ = 7,9 km/s — orbita','v₂ = 11,2 km/s — qochadi'][i],o);};}});

   ions.forEach(o=>{if(!mars){o.s.material.opacity=0;return;}o.t+=dt;if(o.t>3)o.t=0;const p=o.d.clone().multiplyScalar(1.8+o.t*.3);p.x+=o.t*o.t*2;o.s.position.copy(p);o.s.material.opacity=sstep(9,9.5,k)*(1-o.t/3);});};}});

   const p=V3(Math.cos(ang)*rr,Math.sin(ang)*rr,.05);const w=m.side?p.clone().applyAxisAngle(UP,-Math.PI/2+3*Math.PI/4):p.clone().applyAxisAngle(UP,3*Math.PI/4);pos[i*3]=w.x;pos[i*3+1]=w.y;pos[i*3+2]=w.z;const hot=(rr-2.9)/1.8;col[i*3]=1;col[i*3+1]=lerp(.85,.35,hot);col[i*3+2]=lerp(.3,.2,hot);});geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;};}});

  else if(k==='g')TV.show();else if(k==='f')toggleFull();else if(k==='l')toggleLecture();else if(k==='t')showTeacher();else if(k==='h')showHelp();
  else if(k==='p')$('#btnPause').click();else if(k==='s')$('#btnSlow').click();else if(k==='r')$('#btnAuto').click();else if(k==='c'){if(!cine)resetView();}
  else if(/^[0-9]$/.test(e.key)){const n=e.key==='0'?9:+e.key-1;if(!cine&&n<stations.length)goTo(n);}
 });
 document.addEventListener('fullscreenchange',()=>$('#btnFull').classList.toggle('on',!!document.fullscreenElement));
